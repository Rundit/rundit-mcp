name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The committed tools.ts must match what the installed SDK generates.
      - run: npm run codegen:check

      - run: npm run lint

      - run: npm run build

      - run: npm test
