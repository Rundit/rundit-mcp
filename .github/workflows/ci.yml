name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Generate the untracked catalogue from the installed SDK before compilation/tests.
      - run: npm run build

      - run: npm run lint

      - run: npm test
